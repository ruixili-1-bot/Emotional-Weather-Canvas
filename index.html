<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotional Weather Canvas - Ruixi Li</title>

  <!-- p5.js creative coding library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 240px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 {
      margin: 0 0 5px 0;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      margin: 0 0 15px 0;
      font-size: 11px;
      color: #94a3b8;
    }

    .slider-group {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="ui-panel">
    <h2>Weather Canvas</h2>
    <p class="subtitle">Ruixi Li</p>

    <div class="slider-group">
      <label>
        Sleep Quality:
        <span id="sleep-val">70</span>
      </label>
      <input type="range" id="sleepSlider" min="0" max="100" value="70">
    </div>

    <div class="slider-group">
      <label>
        Stress Level:
        <span id="stress-val">30</span>
      </label>
      <input type="range" id="stressSlider" min="0" max="100" value="30">
    </div>

    <div class="slider-group">
      <label>
        Mood Score:
        <span id="mood-val">50</span>
      </label>
      <input type="range" id="moodSlider" min="0" max="100" value="50">
    </div>
  </div>

  <script>
    // Particle system
    let rainParticles = [];

    // Maximum number of active rain particles
    const MAX_PARTICLES = 300;

    // Particle generation timer
    let rainTimer = 0;

    let sleepSlider;
    let stressSlider;
    let moodSlider;

    function setup() {
      createCanvas(windowWidth, windowHeight);

      sleepSlider = select('#sleepSlider');
      stressSlider = select('#stressSlider');
      moodSlider = select('#moodSlider');

      // Update the displayed values when sliders change
      sleepSlider.input(() => {
        select('#sleep-val').html(sleepSlider.value());
      });

      stressSlider.input(() => {
        select('#stress-val').html(stressSlider.value());
      });

      moodSlider.input(() => {
        select('#mood-val').html(moodSlider.value());
      });
    }

    function draw() {
      const sleepVal = Number(sleepSlider.value());
      const stressVal = Number(stressSlider.value());
      const moodVal = Number(moodSlider.value());

      // 1. Background colour controlled by mood
      const coldColour = color(15, 25, 50);
      const warmColour = color(255, 170, 75);

      const moodColour = lerpColor(
        coldColour,
        warmColour,
        moodVal / 100
      );

      background(moodColour);

      // 2. Sun glow controlled by sleep quality
      const glowRadius = map(
        sleepVal,
        0,
        100,
        30,
        220
      );

      noStroke();

      for (
        let radius = glowRadius;
        radius > 0;
        radius -= 12
      ) {
        const alpha = map(
          radius,
          0,
          glowRadius,
          120,
          0
        );

        fill(255, 215, 100, alpha);

        ellipse(
          width / 2,
          height / 3,
          radius * 2
        );
      }

      // 3. Generate rain particles based on stress
      // Higher stress creates rain more frequently.
      const spawnInterval = map(
        stressVal,
        0,
        100,
        700,
        80
      );

      rainTimer += deltaTime;

      if (rainTimer >= spawnInterval) {
        if (rainParticles.length < MAX_PARTICLES) {
          rainParticles.push(new RainDrop(stressVal));
        }

        rainTimer = 0;
      }

      // 4. Update and render existing particles
      for (
        let i = rainParticles.length - 1;
        i >= 0;
        i--
      ) {
        const particle = rainParticles[i];

        particle.update();
        particle.display();

        // Remove particles that have left the canvas
        if (particle.isDead()) {
          rainParticles.splice(i, 1);
        }
      }

      // 5. Storm cloud overlay controlled by stress
      if (stressVal > 40) {
        const cloudAlpha = map(
          stressVal,
          40,
          100,
          0,
          150
        );

        noStroke();
        fill(20, 25, 35, cloudAlpha);
        rect(0, 0, width, height);
      }
    }

    // RainDrop class represents an individual raindrop
    class RainDrop {
      constructor(stress) {
        this.x = random(width);
        this.y = random(-20, 0);

        // Higher stress increases rain speed and length
        this.speed = map(
          stress,
          0,
          100,
          4,
          16
        );

        this.len = map(
          stress,
          0,
          100,
          8,
          22
        );
      }

      update() {
        this.y += this.speed;
      }

      display() {
        stroke(180, 210, 255, 200);
        strokeWeight(1.5);

        line(
          this.x,
          this.y,
          this.x,
          this.y + this.len
        );
      }

      isDead() {
        return this.y > height;
      }
    }

    // Resize the canvas when the browser window changes
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
